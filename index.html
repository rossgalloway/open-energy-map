<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Energy Map Prototype</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #1f2933;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .map-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0 auto;
    }

    svg {
      display: block;
      width: min(800px, 100%);
      height: auto;
    }

    .country {
      stroke: #3f3f3f;
      stroke-width: 0.7;
      cursor: pointer;
      transition: fill 140ms ease;
    }

    #tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 8px 10px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 39, 0.38);
      z-index: 10;
    }

    .modal {
      width: min(420px, 100%);
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d7d7d2;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.18);
    }

    .modal p {
      margin: 0 0 20px;
      color: #111827;
      font-size: 16px;
      line-height: 1.5;
    }

    .modal button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      color: #ffffff;
      background: #111827;
      border: 0;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="tooltip"></div>

  <script type="text/babel" src="script.js"></script>
</body>
</html>
